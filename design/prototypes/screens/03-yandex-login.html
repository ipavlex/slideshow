<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>03 · Вход в Яндекс Диск</title>
<link rel="stylesheet" href="../css/tv.css">
<style>
  .login-card {
    margin: auto;
    width: 1160px;
    background: var(--surface);
    border-radius: 28px;
    padding: 72px;
    display: flex;
    gap: 88px;
    align-items: center;
  }
  .qr-wrap { flex: none; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .qr {
    width: 320px; height: 320px;
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    display: block;
  }
  .qr-url { font-size: 26px; color: var(--text-2); letter-spacing: 0.5px; }
  .code-wrap { flex: 1; }
  .code-caption { font-size: 26px; color: var(--text-2); line-height: 1.4; margin-bottom: 40px; }
  .code {
    display: flex;
    gap: 40px;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 108px;
    font-weight: 700;
    letter-spacing: 14px;
    font-variant-numeric: tabular-nums;
  }
  .wait {
    position: fixed;
    left: 0; right: 0; bottom: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    font-size: 26px;
    color: var(--text-2);
  }
</style>
</head>
<body>
<main class="screen">
  <div class="brand">Слайдшоу</div>
  <h1 class="screen-title" style="text-align:center; margin-top:8px;">Вход в Яндекс Диск</h1>

  <div class="login-card">
    <div class="qr-wrap">
      <svg class="qr" viewBox="0 0 29 29" shape-rendering="crispEdges" role="img" aria-label="QR-код">
        <rect width="29" height="29" fill="#fff"/>
        <!-- finder patterns -->
        <g fill="#000">
          <rect x="0" y="0" width="7" height="7"/><rect x="22" y="0" width="7" height="7"/><rect x="0" y="22" width="7" height="7"/>
        </g>
        <g fill="#fff">
          <rect x="1" y="1" width="5" height="5"/><rect x="23" y="1" width="5" height="5"/><rect x="1" y="23" width="5" height="5"/>
        </g>
        <g fill="#000">
          <rect x="2" y="2" width="3" height="3"/><rect x="24" y="2" width="3" height="3"/><rect x="2" y="24" width="3" height="3"/>
        </g>
        <!-- timing -->
        <g fill="#000">
          <rect x="8" y="6" width="1" height="1"/><rect x="10" y="6" width="1" height="1"/><rect x="12" y="6" width="1" height="1"/><rect x="14" y="6" width="1" height="1"/><rect x="16" y="6" width="1" height="1"/><rect x="18" y="6" width="1" height="1"/><rect x="20" y="6" width="1" height="1"/>
          <rect x="6" y="8" width="1" height="1"/><rect x="6" y="10" width="1" height="1"/><rect x="6" y="12" width="1" height="1"/><rect x="6" y="14" width="1" height="1"/><rect x="6" y="16" width="1" height="1"/><rect x="6" y="18" width="1" height="1"/><rect x="6" y="20" width="1" height="1"/>
        </g>
        <!-- модули-заглушка -->
        <g fill="#000">
          <rect x="9" y="9" width="1" height="1"/><rect x="11" y="9" width="2" height="1"/><rect x="15" y="9" width="1" height="1"/><rect x="17" y="9" width="1" height="1"/><rect x="19" y="9" width="2" height="1"/>
          <rect x="8" y="11" width="1" height="1"/><rect x="10" y="11" width="1" height="1"/><rect x="13" y="11" width="2" height="1"/><rect x="16" y="11" width="1" height="1"/><rect x="18" y="11" width="1" height="1"/><rect x="20" y="11" width="1" height="1"/>
          <rect x="9" y="13" width="2" height="1"/><rect x="12" y="13" width="1" height="1"/><rect x="14" y="13" width="2" height="1"/><rect x="17" y="13" width="2" height="1"/><rect x="20" y="13" width="1" height="1"/>
          <rect x="8" y="15" width="1" height="1"/><rect x="10" y="15" width="2" height="1"/><rect x="13" y="15" width="1" height="1"/><rect x="15" y="15" width="1" height="1"/><rect x="18" y="15" width="2" height="1"/>
          <rect x="9" y="17" width="1" height="1"/><rect x="11" y="17" width="1" height="1"/><rect x="14" y="17" width="2" height="1"/><rect x="17" y="17" width="1" height="1"/><rect x="19" y="17" width="1" height="1"/><rect x="21" y="17" width="1" height="1"/>
          <rect x="8" y="19" width="2" height="1"/><rect x="12" y="19" width="1" height="1"/><rect x="15" y="19" width="1" height="1"/><rect x="18" y="19" width="1" height="1"/><rect x="20" y="19" width="2" height="1"/>
          <rect x="9" y="21" width="1" height="1"/><rect x="11" y="21" width="2" height="1"/><rect x="16" y="21" width="1" height="1"/><rect x="19" y="21" width="2" height="1"/>
          <rect x="9" y="9" width="1" height="1"/><rect x="10" y="10" width="1" height="1"/>
          <rect x="14" y="2" width="1" height="1"/><rect x="16" y="3" width="1" height="1"/><rect x="13" y="4" width="2" height="1"/><rect x="17" y="4" width="1" height="1"/><rect x="15" y="5" width="1" height="1"/>
          <rect x="2" y="10" width="1" height="1"/><rect x="3" y="12" width="2" height="1"/><rect x="2" y="14" width="1" height="1"/><rect x="4" y="15" width="1" height="1"/><rect x="3" y="17" width="1" height="1"/><rect x="2" y="19" width="2" height="1"/><rect x="4" y="20" width="1" height="1"/>
          <rect x="24" y="10" width="1" height="1"/><rect x="25" y="12" width="1" height="1"/><rect x="23" y="13" width="2" height="1"/><rect x="26" y="15" width="1" height="1"/><rect x="24" y="17" width="1" height="1"/><rect x="25" y="19" width="2" height="1"/><rect x="23" y="20" width="1" height="1"/>
          <rect x="12" y="24" width="1" height="1"/><rect x="14" y="23" width="1" height="1"/><rect x="15" y="25" width="2" height="1"/><rect x="18" y="24" width="1" height="1"/><rect x="20" y="23" width="1" height="1"/><rect x="13" y="26" width="1" height="1"/><rect x="17" y="26" width="2" height="1"/>
        </g>
      </svg>
      <div class="qr-url">yandex.ru/device</div>
    </div>

    <div class="code-wrap">
      <div class="code-caption">Отсканируйте QR-код или откройте ссылку на телефоне и введите код</div>
      <div class="code"><span>AB3D</span><span>9KQ2</span></div>
    </div>
  </div>

  <div class="wait">
    <div class="spinner"></div>
    <span>Ожидаем подтверждение…</span>
  </div>

  <div class="hints">
    <span><span class="keycap">Назад</span> отмена</span>
  </div>
</main>

<script src="../js/tv.js"></script>
<script>
  // Симуляция подтверждения входа с телефона
  setTimeout(function () { location.href = '04-browser.html'; }, 6000);
</script>
</body>
</html>
